[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "markdown-rag-eval"
version = "0.1.0"
description = "Retrieval over a markdown corpus, with an eval harness that measures it"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Lucas Sandoval"},
]
keywords = ["rag", "retrieval", "embeddings", "evaluation", "markdown"]

dependencies = [
    "python-frontmatter>=1.1.0",
    "pydantic>=2.5.0",
    "numpy>=1.26",
    "sentence-transformers>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.8.0",
    "types-PyYAML>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mdrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
